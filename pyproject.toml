[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dandori"
version = "0.0.1"
description = "段取り：日本の業務担当者が読めて、企業が安心して動かせる業務自動化言語"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
dandori = "dandori.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"dandori.stdlib.japan" = ["data/*.csv"]
