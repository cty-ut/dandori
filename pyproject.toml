[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dandori"
version = "0.0.1"
description = "段取り：日本の業務担当者が読めて、企業が安心して動かせる業務自動化言語"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"

[project.urls]
Repository = "https://github.com/cty-ut/dandori"
Issues = "https://github.com/cty-ut/dandori/issues"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]
# AI 助手（独立的包 dandori_ai）：语言核心不需要这些
ai = ["anthropic>=1.13", "openai>=3.29"]

[project.scripts]
dandori = "dandori.cli:main"
dandori-ai = "dandori_ai.cli:main"
dandori-platform = "dandori_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# 先只检查真正的错误（语法错误、未定义的名字、未使用的导入等）。风格以后再统一
select = ["E9", "F"]

[tool.coverage.run]
source = ["src"]
omit = ["*/__main__.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"dandori.stdlib.japan" = ["data/*.csv"]
"dandori_ai" = ["reference/*.md", "reference/examples/*.dandori"]
